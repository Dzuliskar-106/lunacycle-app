<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LunaCycle - Kalender Siklus</title>
  <style>
    :root {
      --bg: #FDF7F9;
      --surface: #FFFFFF;
      --primary: #E11D48;
      --primary-light: #FFE4E6;
      --primary-dark: #9F1239;
      --purple: #7E22CE;
      --purple-light: #F3E8FF;
      --text-main: #271E2B;
      --text-muted: #6E6275;
      --border: #F3E1E7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      overflow-x: hidden;
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      background: linear-gradient(135deg, #E11D48 0%, #9333EA 100%);
      color: #FFFFFF;
      padding: calc(env(safe-area-inset-top, 16px) + 14px) 18px 22px 18px;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      box-shadow: 0 6px 20px rgba(225, 29, 72, 0.22);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand h1 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .brand p {
      font-size: 11px;
      opacity: 0.9;
    }

    .btn-test {
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
    }

    .btn-test:active { transform: scale(0.95); }

    .status-banner {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 18px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-info span.label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.85;
    }

    .status-info h2 {
      font-size: 17px;
      font-weight: 800;
      margin: 2px 0;
    }

    .status-info p {
      font-size: 12px;
      opacity: 0.95;
    }

    .countdown-box {
      background: #FFFFFF;
      color: var(--primary);
      border-radius: 14px;
      padding: 8px 14px;
      text-align: center;
      min-width: 72px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .countdown-box strong {
      display: block;
      font-size: 20px;
      font-weight: 900;
      line-height: 1.1;
    }

    .countdown-box small {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border-radius: 24px;
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(39, 30, 43, 0.04);
    }

    .calendar-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .cal-header h3 {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-main);
    }

    .nav-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: none;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
    }

    .nav-btn:active { transform: scale(0.92); }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      flex: 1;
    }

    .day-cell {
      min-height: 46px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      background: #F9F5F7;
      color: var(--text-main);
      position: relative;
      cursor: pointer;
      user-select: none;
    }

    .day-cell:active { transform: scale(0.93); }

    .phase-period {
      background: var(--primary);
      color: #FFFFFF;
      font-weight: 800;
      box-shadow: 0 3px 8px rgba(225, 29, 72, 0.28);
    }

    .phase-predicted {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1.5px dashed #FB7185;
      font-weight: 700;
    }

    .phase-fertile {
      background: var(--purple-light);
      color: var(--purple);
      font-weight: 700;
    }

    .phase-ovulation {
      background: var(--purple);
      color: #FFFFFF;
      font-weight: 800;
      box-shadow: 0 3px 8px rgba(126, 34, 206, 0.28);
    }

    .today-ring {
      outline: 2.5px solid #271E2B;
      outline-offset: 1px;
    }

    .note-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #F59E0B;
      position: absolute;
      bottom: 5px;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
    }

    .settings-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-offline {
      font-size: 11px;
      background: #DCFCE7;
      color: #15803D;
      padding: 3px 9px;
      border-radius: 99px;
      font-weight: 700;
    }

    .form-group { margin-bottom: 10px; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 13px;
      border: 1.5px solid #E5D5DC;
      font-size: 14px;
      font-weight: 600;
      background: #FFFFFF;
      color: var(--text-main);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-save {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(135deg, #E11D48 0%, #BE123C 100%);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 4px;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
    }

    .btn-save:active { transform: scale(0.98); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 12, 24, 0.55);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      padding: 12px;
    }

    .modal-backdrop.active { display: flex; }

    .modal-box {
      background: #FFFFFF;
      width: 100%;
      max-width: 480px;
      border-radius: 24px;
      padding: 18px;
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-header h4 { font-size: 16px; font-weight: 800; }

    .btn-close {
      background: #F3E8EE;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .btn-period-set {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: none;
      padding: 12px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 800;
    }

    .btn-note-save {
      background: var(--purple);
      color: #FFFFFF;
      border: none;
      padding: 12px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="header-top">
        <div class="brand">
          <div class="brand-logo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M12 2.5C12 2.5 6 9.2 6 14C6 17.3137 8.68629 20 12 20C15.3137 20 18 17.3137 18 14C18 9.2 12 2.5 12 2.5Z" fill="#FFFFFF"/>
              <path d="M13.5 11.5C12.2 11.5 11.2 12.5 11.2 13.8C11.2 15.1 12.2 16.1 13.5 16.1C14.1 16.1 14.6 15.9 15 15.5C14.1 15.4 13.4 14.7 13.4 13.8C13.4 12.9 14.1 12.2 15 12.1C14.6 11.7 14.1 11.5 13.5 11.5Z" fill="#E11D48"/>
            </svg>
          </div>
          <div>
            <h1>LunaCycle</h1>
            <p>Pelacak Haid & Ovulasi Offline</p>
          </div>
        </div>
        <button class="btn-test" onclick="testNativeNotification()">🔔 Tes Notif</button>
      </div>

      <div class="status-banner">
        <div class="status-info">
          <span class="label">Status Siklus</span>
          <h2 id="statusTitle">Menghitung...</h2>
          <p id="statusSubtitle">Atur tanggal haid terakhir</p>
        </div>
        <div class="countdown-box">
          <strong id="countdownDays">-</strong>
          <small>Hari Lagi</small>
        </div>
      </div>
    </header>

    <main>
      <section class="card calendar-card">
        <div>
          <div class="cal-header">
            <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
            <h3 id="monthYearLabel">Bulan Tahun</h3>
            <button class="nav-btn" onclick="changeMonth(1)">›</button>
          </div>

          <div class="weekdays">
            <div>MIN</div><div>SEN</div><div>SEL</div><div>RAB</div><div>KAM</div><div>JUM</div><div>SAB</div>
          </div>

          <div id="calendarDays" class="days-grid"></div>
        </div>

        <div class="legend">
          <div class="legend-item"><span class="dot" style="background:#E11D48;"></span> Haid Tercatat</div>
          <div class="legend-item"><span class="dot" style="background:#FFE4E6; border:1.5px dashed #FB7185;"></span> Prediksi Haid</div>
          <div class="legend-item"><span class="dot" style="background:#F3E8FF;"></span> Masa Subur</div>
          <div class="legend-item"><span class="dot" style="background:#7E22CE;"></span> Puncak Ovulasi</div>
        </div>
      </section>

      <section class="card">
        <div class="settings-title">
          <span>Pengaturan Siklus & Alarm</span>
          <span class="badge-offline">100% Offline</span>
        </div>

        <div class="form-group">
          <label>Hari Pertama Haid Terakhir</label>
          <input type="date" id="lastPeriodInput" />
        </div>

        <div class="form-row">
          <div>
            <label>Siklus (Hari)</label>
            <input type="number" id="cycleLengthInput" min="20" max="45" value="28" />
          </div>
          <div>
            <label>Lama Haid (Hari)</label>
            <input type="number" id="periodDurationInput" min="2" max="10" value="5" />
          </div>
        </div>

        <div class="form-group">
          <label>Jam Pengingat Notifikasi HP</label>
          <input type="time" id="reminderTimeInput" value="08:00" />
        </div>

        <button class="btn-save" onclick="saveSettingsAndSchedule()">Simpan & Jadwalkan Notifikasi</button>
      </section>
    </main>
  </div>

  <div id="noteModal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <h4 id="modalDateTitle">Detail Tanggal</h4>
        <button class="btn-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="form-group">
        <label>Kondisi / Gejala Hari Ini</label>
        <select id="moodSelect">
          <option value="">-- Pilih gejala --</option>
          <option value="Kram Perut">😣 Kram Perut</option>
          <option value="Mood Swing">🥺 Mood Swing / Sensitif</option>
          <option value="Nyeri Payudara">😫 Nyeri Payudara</option>
          <option value="Lelah / Mengantuk">😴 Lelah / Mengantuk</option>
          <option value="Fit & Nyaman">😊 Fit & Nyaman</option>
        </select>
      </div>
      <div class="form-group">
        <label>Catatan Pribadi</label>
        <textarea id="noteText" rows="2" placeholder="Tulis catatan singkat di sini..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-period-set" onclick="setAsPeriodStart()">🩸 Tandai Mulai Haid</button>
        <button class="btn-note-save" onclick="saveDailyNote()">Simpan Catatan</button>
      </div>
    </div>
  </div>

  <script>
    const CHANNEL_ID = "lunacycle_high_priority";

    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseLocalDate(dateStr) {
      if (!dateStr || !dateStr.includes('-')) return new Date();
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    let currentViewDate = new Date();
    let selectedDateKey = null;

    const defaultData = {
      lastPeriod: formatDateKey(new Date()),
      cycleLength: 28,
      periodDuration: 5,
      reminderTime: "08:00",
      notes: {}
    };

    let appData;
    try {
      const saved = JSON.parse(localStorage.getItem('lunacycle_data'));
      appData = saved ? { ...defaultData, ...saved, notes: saved.notes || {} } : defaultData;
    } catch (e) {
      appData = defaultData;
    }

    function getLocalNotifPlugin() {
      try {
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) {
          return window.Capacitor.Plugins.LocalNotifications;
        }
      } catch (e) {}
      return null;
    }

    async function setupNotificationChannel() {
      const LocalNotifications = getLocalNotifPlugin();
      if (!LocalNotifications) return;

      try {
        await LocalNotifications.createChannel({
          id: CHANNEL_ID,
          name: "Pengingat Siklus LunaCycle",
          description: "Notifikasi jadwal haid, masa subur, dan ovulasi",
          importance: 5,
          visibility: 1,
          vibration: true
        });
      } catch (e) {}
    }

    async function requestAllPermissions() {
      const LocalNotifications = getLocalNotifPlugin();
      if (!LocalNotifications) return false;

      try {
        await setupNotificationChannel();
        const status = await LocalNotifications.checkPermissions();
        if (status.display !== 'granted') {
          const req = await LocalNotifications.requestPermissions();
          if (req.display !== 'granted') return false;
        }
        return true;
      } catch (e) {
        return false;
      }
    }

    async function testNativeNotification() {
      const LocalNotifications = getLocalNotifPlugin();
      if (!LocalNotifications) {
        alert("Plugin notifikasi tidak terdeteksi.");
        return;
      }

      try {
        const granted = await requestAllPermissions();
        if (!granted) {
          alert("Izin notifikasi belum diizinkan. Ketuk Izinkan saat diminta atau aktifkan di Pengaturan HP.");
          return;
        }

        await LocalNotifications.schedule({
          notifications: [{
            id: Math.floor(Math.random() * 10000) + 1000,
            title: "LunaCycle Pengingat 🌸",
            body: "Notifikasi HP berhasil aktif! Pengingat haid & masa subur siap berjalan.",
            channelId: CHANNEL_ID,
            schedule: { at: new Date(Date.now() + 1500), allowWhileIdle: true }
          }]
        });
      } catch (err) {
        alert("Gagal menjadwalkan notifikasi: " + err.message);
      }
    }

    async function scheduleCycleNotifications(nextPeriodDate, ovulationDate) {
      const LocalNotifications = getLocalNotifPlugin();
      if (!LocalNotifications) return;

      try {
        const granted = await requestAllPermissions();
        if (!granted) return;

        try {
          await LocalNotifications.cancel({ notifications: [{ id: 101 }, { id: 102 }, { id: 103 }] });
        } catch (e) {}

        const [hour, minute] = (appData.reminderTime || "08:00").split(':').map(Number);
        const now = new Date();
        const list = [];

        const pmsDate = new Date(nextPeriodDate);
        pmsDate.setDate(pmsDate.getDate() - 2);
        pmsDate.setHours(hour, minute, 0, 0);
        if (pmsDate > now) {
          list.push({
            id: 101,
            title: "Persiapan Haid (H-2) 🌷",
            body: "Perkiraan haid 2 hari lagi. Siapkan pembalut & jaga istirahat ya!",
            channelId: CHANNEL_ID,
            schedule: { at: pmsDate, allowWhileIdle: true }
          });
        }

        const startNotif = new Date(nextPeriodDate);
        startNotif.setHours(hour, minute, 0, 0);
        if (startNotif > now) {
          list.push({
            id: 102,
            title: "Perkiraan Haid Hari Ini 🩸",
            body: "Hari ini perkiraan hari pertama haidmu. Ketuk untuk mencatat di LunaCycle.",
            channelId: CHANNEL_ID,
            schedule: { at: startNotif, allowWhileIdle: true }
          });
        }

        const ovulNotif = new Date(ovulationDate);
        ovulNotif.setHours(hour, minute, 0, 0);
        if (ovulNotif > now) {
          list.push({
            id: 103,
            title: "Puncak Masa Subur (Ovulasi) 💜",
            body: "Hari ini adalah puncak masa subur dalam siklus bulananmu.",
            channelId: CHANNEL_ID,
            schedule: { at: ovulNotif, allowWhileIdle: true }
          });
        }

        if (list.length > 0) {
          await LocalNotifications.schedule({ notifications: list });
        }
      } catch (e) {}
    }

    function calculateCycleData() {
      const start = parseLocalDate(appData.lastPeriod);
      const cycleLen = Number(appData.cycleLength) || 28;
      const periodDur = Number(appData.periodDuration) || 5;

      const nextPeriod = new Date(start);
      nextPeriod.setDate(start.getDate() + cycleLen);

      const ovulation = new Date(nextPeriod);
      ovulation.setDate(nextPeriod.getDate() - 14);

      const fertileStart = new Date(ovulation);
      fertileStart.setDate(ovulation.getDate() - 4);

      const fertileEnd = new Date(ovulation);
      fertileEnd.setDate(ovulation.getDate() + 1);

      return { start, nextPeriod, ovulation, fertileStart, fertileEnd, periodDur };
    }

    function updateDashboard() {
      const { nextPeriod, ovulation } = calculateCycleData();
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const diffDays = Math.ceil((nextPeriod - today) / (1000 * 60 * 60 * 24));
      const statusTitle = document.getElementById('statusTitle');
      const statusSubtitle = document.getElementById('statusSubtitle');
      const countdownDays = document.getElementById('countdownDays');

      if (diffDays > 0) {
        countdownDays.textContent = diffDays;
        statusTitle.textContent = "Menuju Haid Berikutnya";
        statusSubtitle.textContent = `Perkiraan: ${nextPeriod.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}`;
      } else if (diffDays === 0) {
        countdownDays.textContent = "Hari Ini";
        statusTitle.textContent = "Perkiraan Mulai Haid";
        statusSubtitle.textContent = "Ketuk tanggal hari ini jika sudah mulai";
      } else {
        countdownDays.textContent = Math.abs(diffDays);
        statusTitle.textContent = "Terlambat dari Jadwal";
        statusSubtitle.textContent = `Lewat ${Math.abs(diffDays)} hari dari perkiraan`;
      }

      scheduleCycleNotifications(nextPeriod, ovulation);
    }

    function renderCalendar() {
      const year = currentViewDate.getFullYear();
      const month = currentViewDate.getMonth();
      const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      document.getElementById('monthYearLabel').textContent = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const grid = document.getElementById('calendarDays');
      grid.innerHTML = '';

      const { start, nextPeriod, ovulation, fertileStart, fertileEnd, periodDur } = calculateCycleData();
      const todayKey = formatDateKey(new Date());

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const cellDate = new Date(year, month, day);
        const key = formatDateKey(cellDate);
        let phaseClass = "";

        const periodEnd = new Date(start);
        periodEnd.setDate(start.getDate() + periodDur - 1);

        const nextPeriodEnd = new Date(nextPeriod);
        nextPeriodEnd.setDate(nextPeriod.getDate() + periodDur - 1);

        if (cellDate >= start && cellDate <= periodEnd) {
          phaseClass = "phase-period";
        } else if (cellDate >= nextPeriod && cellDate <= nextPeriodEnd) {
          phaseClass = "phase-predicted";
        } else if (key === formatDateKey(ovulation)) {
          phaseClass = "phase-ovulation";
        } else if (cellDate >= fertileStart && cellDate <= fertileEnd) {
          phaseClass = "phase-fertile";
        }

        const todayClass = (key === todayKey) ? "today-ring" : "";
        const hasNoteDot = appData.notes[key] ? `<span class="note-dot"></span>` : "";

        grid.innerHTML += `
          <div onclick="openNoteModal('${key}')" class="day-cell ${phaseClass} ${todayClass}">
            <span>${day}</span>
            ${hasNoteDot}
          </div>
        `;
      }
    }

    function changeMonth(step) {
      currentViewDate.setMonth(currentViewDate.getMonth() + step);
      renderCalendar();
    }

    function saveSettingsAndSchedule() {
      appData.lastPeriod = document.getElementById('lastPeriodInput').value || formatDateKey(new Date());
      appData.cycleLength = Number(document.getElementById('cycleLengthInput').value) || 28;
      appData.periodDuration = Number(document.getElementById('periodDurationInput').value) || 5;
      appData.reminderTime = document.getElementById('reminderTimeInput').value || "08:00";

      localStorage.setItem('lunacycle_data', JSON.stringify(appData));
      updateDashboard();
      renderCalendar();
      alert("Pengaturan disimpan & jadwal notifikasi HP diperbarui!");
    }

    function openNoteModal(dateKey) {
      selectedDateKey = dateKey;
      const dateObj = parseLocalDate(dateKey);
      document.getElementById('modalDateTitle').textContent = dateObj.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      const existing = appData.notes[dateKey] || { mood: "", text: "" };
      document.getElementById('moodSelect').value = existing.mood;
      document.getElementById('noteText').value = existing.text;
      document.getElementById('noteModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('noteModal').classList.remove('active');
    }

    function saveDailyNote() {
      const mood = document.getElementById('moodSelect').value;
      const text = document.getElementById('noteText').value.trim();
      if (!mood && !text) {
        delete appData.notes[selectedDateKey];
      } else {
        appData.notes[selectedDateKey] = { mood, text };
      }
      localStorage.setItem('lunacycle_data', JSON.stringify(appData));
      closeModal();
      renderCalendar();
    }

    function setAsPeriodStart() {
      appData.lastPeriod = selectedDateKey;
      document.getElementById('lastPeriodInput').value = selectedDateKey;
      localStorage.setItem('lunacycle_data', JSON.stringify(appData));
      closeModal();
      updateDashboard();
      renderCalendar();
    }

    document.getElementById('lastPeriodInput').value = appData.lastPeriod;
    document.getElementById('cycleLengthInput').value = appData.cycleLength;
    document.getElementById('periodDurationInput').value = appData.periodDuration;
    document.getElementById('reminderTimeInput').value = appData.reminderTime;

    renderCalendar();
    updateDashboard();
    requestAllPermissions();
  </script>
</body>
</html>
