name: Build LunaCycle V7 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Add Android platform
        run: |
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/local-notifications@^6.0.0 @capacitor/splash-screen@^6.0.0
          npx cap add android
          npx cap sync android

      - name: Generate Clean App Icon & Notification SmallIcon
        run: |
          pip install pillow
          python3 - << 'EOF'
          from PIL import Image, ImageDraw
          import os, shutil

          res_dir = "android/app/src/main/res"

          def draw_lunacycle_emblem(draw, cx, cy, scale=1.0):
              r_drop = int(105 * scale)
              top_y = int(cy - 175 * scale)
              offset_y = int(28 * scale)
              trim_x = int(6 * scale)
              draw.ellipse([cx - r_drop, cy - r_drop, cx + r_drop, cy + r_drop], fill=(255, 255, 255, 255))
              draw.polygon([(cx - r_drop + trim_x, cy - offset_y), (cx + r_drop - trim_x, cy - offset_y), (cx, top_y)], fill=(255, 255, 255, 255))
              draw.ellipse([cx - int(48*scale), cy - int(32*scale), cx + int(48*scale), cy + int(64*scale)], fill=(225, 29, 72, 255))
              draw.ellipse([cx - int(22*scale), cy - int(45*scale), cx + int(65*scale), cy + int(45*scale)], fill=(255, 255, 255, 255))

          # 1. Ikon Launcher Utama (512x512)
          size = 512
          img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          for y in range(size):
              r = int(225 - (y / size) * 78)
              g = int(29 + (y / size) * 22)
              b = int(72 + (y / size) * 162)
              draw.line([(0, y), (size, y)], fill=(r, g, b, 255))

          mask = Image.new("L", (size, size), 0)
          ImageDraw.Draw(mask).rounded_rectangle([0, 0, size, size], radius=115, fill=255)
          img.putalpha(mask)
          draw_lunacycle_emblem(draw, 256, 285, 1.0)

          # Foreground aman tanpa lingkaran abu-abu (skala lebih kecil di tengah)
          fg_img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          fg_draw = ImageDraw.Draw(fg_img)
          draw_lunacycle_emblem(fg_draw, 256, 275, 0.65)

          anydpi_dir = os.path.join(res_dir, "mipmap-anydpi-v26")
          if os.path.exists(anydpi_dir):
              shutil.rmtree(anydpi_dir)

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }
          for folder, px in sizes.items():
              target_dir = os.path.join(res_dir, folder)
              if os.path.exists(target_dir):
                  img.resize((px, px), Image.LANCZOS).save(os.path.join(target_dir, "ic_launcher.png"))
                  img.resize((px, px), Image.LANCZOS).save(os.path.join(target_dir, "ic_launcher_round.png"))
                  fg_img.resize((px, px), Image.LANCZOS).save(os.path.join(target_dir, "ic_launcher_foreground.png"))

          # 2. Ikon Notifikasi Siluet Putih Monokrom
          notif_size = 96
          n_img = Image.new("RGBA", (notif_size, notif_size), (0, 0, 0, 0))
          n_draw = ImageDraw.Draw(n_img)
          ncx, ncy, nr = 48, 55, 24
          n_draw.ellipse([ncx - nr, ncy - nr, ncx + nr, ncy + nr], fill=(255, 255, 255, 255))
          n_draw.polygon([(ncx - nr + 2, ncy - 6), (ncx + nr - 2, ncy - 6), (ncx, 14)], fill=(255, 255, 255, 255))
          n_draw.ellipse([ncx - 10, ncy - 6, ncx + 10, ncy + 14], fill=(0, 0, 0, 0))
          n_draw.ellipse([ncx - 4, ncy - 9, ncx + 14, ncy + 9], fill=(255, 255, 255, 255))

          drawable_dir = os.path.join(res_dir, "drawable")
          os.makedirs(drawable_dir, exist_ok=True)
          n_img.save(os.path.join(drawable_dir, "ic_stat_lunacycle.png"))
          EOF

      - name: Add Universal Notification Permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>/' $MANIFEST

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunaCycle-APK-V7
          path: android/app/build/outputs/apk/debug/app-debug.apk
