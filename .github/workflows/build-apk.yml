name: Build LunaCycle Universal Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Add Android platform
        run: |
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/local-notifications@^6.0.0
          npx cap add android
          npx cap sync android

      - name: Generate Launcher Icon & Universal Notification SmallIcon
        run: |
          pip install pillow
          python3 - << 'EOF'
          from PIL import Image, ImageDraw
          import os, shutil

          size = 512
          img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)

          for y in range(size):
              r = int(225 - (y / size) * 78)
              g = int(29 + (y / size) * 22)
              b = int(72 + (y / size) * 162)
              draw.line([(0, y), (size, y)], fill=(r, g, b, 255))

          mask = Image.new("L", (size, size), 0)
          ImageDraw.Draw(mask).rounded_rectangle([0, 0, size, size], radius=115, fill=255)
          img.putalpha(mask)

          cx, cy = 256, 285
          r_drop = 105
          draw.ellipse([cx - r_drop, cy - r_drop, cx + r_drop, cy + r_drop], fill=(255, 255, 255, 255))
          draw.polygon([(cx - r_drop + 6, cy - 28), (cx + r_drop - 6, cy - 28), (cx, 110)], fill=(255, 255, 255, 255))

          draw.ellipse([cx - 48, cy - 32, cx + 48, cy + 64], fill=(225, 29, 72, 255))
          draw.ellipse([cx - 22, cy - 45, cx + 65, cy + 45], fill=(255, 255, 255, 255))

          res_dir = "android/app/src/main/res"
          anydpi_dir = os.path.join(res_dir, "mipmap-anydpi-v26")
          if os.path.exists(anydpi_dir):
              shutil.rmtree(anydpi_dir)

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }
          for folder, px in sizes.items():
              target_dir = os.path.join(res_dir, folder)
              if os.path.exists(target_dir):
                  resized = img.resize((px, px), Image.LANCZOS)
                  resized.save(os.path.join(target_dir, "ic_launcher.png"))
                  resized.save(os.path.join(target_dir, "ic_launcher_round.png"))
                  resized.save(os.path.join(target_dir, "ic_launcher_foreground.png"))

          notif_size = 96
          n_img = Image.new("RGBA", (notif_size, notif_size), (0, 0, 0, 0))
          n_draw = ImageDraw.Draw(n_img)
          ncx, ncy = 48, 55
          nr = 24
          n_draw.ellipse([ncx - nr, ncy - nr, ncx + nr, ncy + nr], fill=(255, 255, 255, 255))
          n_draw.polygon([(ncx - nr + 2, ncy - 6), (ncx + nr - 2, ncy - 6), (ncx, 14)], fill=(255, 255, 255, 255))
          n_draw.ellipse([ncx - 10, ncy - 6, ncx + 10, ncy + 14], fill=(0, 0, 0, 0))
          n_draw.ellipse([ncx - 4, ncy - 9, ncx + 14, ncy + 9], fill=(255, 255, 255, 255))

          drawable_dir = os.path.join(res_dir, "drawable")
          os.makedirs(drawable_dir, exist_ok=True)
          n_img.save(os.path.join(drawable_dir, "ic_stat_lunacycle.png"))
          EOF

      - name: Add Universal Notification Permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <uses-permission android:name="android.permission.VIBRATE" \/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>/' $MANIFEST

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunaCycle-Universal-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
