name: Build LunaCycle Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Add Android platform
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Generate Custom LunaCycle App Icon
        run: |
          python3 - << 'EOF'
          from PIL import Image, ImageDraw
          import os

          size = 512
          img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)

          # Background gradasi rose-pink dengan sudut membulat
          for y in range(size):
              r = int(225 - (y / size) * 78)
              g = int(29 + (y / size) * 22)
              b = int(72 + (y / size) * 162)
              draw.line([(0, y), (size, y)], fill=(r, g, b, 255))

          # Mask rounded square
          mask = Image.new("L", (size, size), 0)
          ImageDraw.Draw(mask).rounded_rectangle([0, 0, size, size], radius=115, fill=255)
          img.putalpha(mask)

          # Gambar simbol tetesan darah / siklus putih di tengah
          cx, cy = 256, 285
          r_drop = 105
          draw.ellipse([cx - r_drop, cy - r_drop, cx + r_drop, cy + r_drop], fill=(255, 255, 255, 255))
          draw.polygon([(cx - r_drop + 6, cy - 28), (cx + r_drop - 6, cy - 28), (cx, 110)], fill=(255, 255, 255, 255))

          # Gambar bulan sabit rose di dalam tetesan
          draw.ellipse([cx - 48, cy - 32, cx + 48, cy + 64], fill=(225, 29, 72, 255))
          draw.ellipse([cx - 22, cy - 45, cx + 65, cy + 45], fill=(255, 255, 255, 255))

          os.makedirs("assets", exist_ok=True)
          img.save("assets/icon.png")

          # Replace semua ikon launcher Android
          res_dir = "android/app/src/main/res"
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }
          for folder, px in sizes.items():
              target_dir = os.path.join(res_dir, folder)
              if os.path.exists(target_dir):
                  resized = img.resize((px, px), Image.LANCZOS)
                  resized.save(os.path.join(target_dir, "ic_launcher.png"))
                  resized.save(os.path.join(target_dir, "ic_launcher_round.png"))
                  resized.save(os.path.join(target_dir, "ic_launcher_foreground.png"))
          EOF

      - name: Add Notification Permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>/' $MANIFEST

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunaCycle-APK-V2
          path: android/app/build/outputs/apk/debug/app-debug.apk
